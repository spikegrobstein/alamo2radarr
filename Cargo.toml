[workspace]
members = ["crates/alamo2radarr", "crates/alamo_movies", "crates/radarr"]
default-members = ["crates/alamo2radarr"]
resolver = "3"

[workspace.package]
version = "0.2.0"
authors = ["Spike Grobstein <me@spike.cx>"]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/spikegrobstein/alamo2radarr"

[workspace.dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"
url = "2.5.4"
